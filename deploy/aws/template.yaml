AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  PY Fitness gym management app on a single free-tier EC2 instance.
  Node/Express serves the API and the React build; SQLite stores data on the
  instance disk; Caddy provides free HTTPS via an <ip>.sslip.io hostname.
  A zero-dollar AWS Budget emails you if any charge at all appears.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives the AWS Budget alert if any cost appears (confirm the subscription email AWS sends).
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t2.micro]
    Description: Free-tier eligible instance type (t3.micro is eligible in every region under the current free plan).
  RepoUrl:
    Type: String
    Default: https://github.com/Yogesh1533/gym-management.git
  GitBranch:
    Type: String
    Default: main
  DemoResetHours:
    Type: Number
    Default: 24
    Description: Restore the demo data every N hours (0 = never). Keeps the public demo tidy.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PY Fitness - HTTP and HTTPS only (admin access is via SSM Session Manager, no SSH port)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal: { Timeout: PT30M }
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      # Stop, don't terminate, if someone runs "shutdown" inside the instance
      InstanceInitiatedShutdownBehavior: stop
      CreditSpecification:
        # "standard" means the CPU is throttled instead of billing for extra burst credits
        CPUCredits: standard
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 10, VolumeType: gp3, DeleteOnTermination: true, Encrypted: true }
      Tags:
        - { Key: Name, Value: py-fitness }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/py-fitness-setup.log 2>&1
          # cfn-signal reports success/failure back to CloudFormation
          dnf install -y aws-cfn-bootstrap || true
          # On any error, send the failing line and the end of the log so it shows in the stack events
          fail() {
            REASON="Setup failed at line $1: $(tail -n 5 /var/log/py-fitness-setup.log | tr '\n"' ' ' | cut -c1-900)"
            /opt/aws/bin/cfn-signal -e 1 --reason "$REASON" --stack ${AWS::StackName} --resource AppInstance --region ${AWS::Region}
          }
          trap 'fail $LINENO' ERR

          # 2 GB swap so the React build fits in 1 GB of RAM
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          fi

          dnf install -y git gcc-c++ make python3 tar xz

          # Node.js 22 from the official release, checksum-verified. Linked into /usr/bin
          # because sudo's PATH on Amazon Linux does not include /usr/local/bin.
          NODE_BASE=https://nodejs.org/dist/latest-v22.x
          cd /tmp
          curl -fsSL "$NODE_BASE/SHASUMS256.txt" -o SHASUMS256.txt
          NODE_TARBALL=$(awk '/linux-x64.tar.xz$/{print $2}' SHASUMS256.txt)
          curl -fsSL "$NODE_BASE/$NODE_TARBALL" -o "$NODE_TARBALL"
          grep " $NODE_TARBALL\$" SHASUMS256.txt | sha256sum -c -
          mkdir -p /opt/node && tar -xJf "$NODE_TARBALL" -C /opt/node --strip-components=1
          for bin in node npm npx; do ln -sf /opt/node/bin/$bin /usr/bin/$bin; done
          node -v && npm -v

          # Caddy (static binary) for automatic HTTPS
          curl -fsSL https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin caddy
          chmod +x /usr/local/bin/caddy

          id gym || useradd --system --create-home --home-dir /opt/gym gym
          sudo -u gym git clone --branch "${GitBranch}" "${RepoUrl}" /opt/gym/app

          cd /opt/gym/app/backend
          sudo -u gym npm ci --omit=dev
          cd /opt/gym/app/frontend
          sudo -u gym npm ci
          sudo -u gym env INLINE_RUNTIME_CHUNK=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS=--max-old-space-size=1536 npm run build

          if [ ! -f /opt/gym/app/backend/.env ]; then
            cat > /opt/gym/app/backend/.env <<ENV
          NODE_ENV=production
          PORT=5000
          DB_DIALECT=sqlite
          DB_STORAGE=/opt/gym/data/gym.sqlite
          JWT_SECRET=$(openssl rand -hex 32)
          JWT_EXPIRE=7d
          AUTO_SEED=true
          DEMO_RESET_HOURS=${DemoResetHours}
          ENABLE_HSTS=true
          ENV
            chown gym:gym /opt/gym/app/backend/.env && chmod 600 /opt/gym/app/backend/.env
          fi
          install -d -o gym -g gym /opt/gym/data

          cat > /etc/systemd/system/py-fitness.service <<'UNIT'
          [Unit]
          Description=PY Fitness API + web app
          After=network-online.target
          [Service]
          User=gym
          WorkingDirectory=/opt/gym/app/backend
          ExecStart=/usr/bin/node server.js
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target
          UNIT

          # The public IP can change after a stop/start, so derive the sslip.io
          # hostname from instance metadata every time Caddy starts.
          cat > /usr/local/bin/py-fitness-caddyfile <<'SCRIPT'
          #!/bin/bash
          set -e
          TOKEN=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
          IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)
          HOST="$(echo "$IP" | tr . -).sslip.io"
          mkdir -p /etc/caddy
          # HTTPS on the sslip.io name, plus plain HTTP on the bare IP as a fallback
          printf '%s {\n  encode gzip\n  reverse_proxy 127.0.0.1:5000\n}\nhttp://%s {\n  encode gzip\n  reverse_proxy 127.0.0.1:5000\n}\n' "$HOST" "$IP" > /etc/caddy/Caddyfile
          echo "https://$HOST" > /etc/caddy/site-url
          SCRIPT
          chmod +x /usr/local/bin/py-fitness-caddyfile

          cat > /etc/systemd/system/caddy.service <<'UNIT'
          [Unit]
          Description=Caddy reverse proxy
          After=network-online.target py-fitness.service
          [Service]
          Environment=HOME=/var/lib/caddy
          ExecStartPre=/usr/local/bin/py-fitness-caddyfile
          ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          Restart=always
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          [Install]
          WantedBy=multi-user.target
          UNIT
          mkdir -p /var/lib/caddy

          systemctl daemon-reload
          systemctl enable --now py-fitness caddy

          # Wait for the app to answer before telling CloudFormation we're done
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/api/health && break
            sleep 5
          done
          curl -sf http://127.0.0.1:5000/api/health
          /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource AppInstance --region ${AWS::Region}

  ZeroSpendBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-zero-spend'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 1, Unit: USD }
      NotificationsWithSubscribers:
        # Alert as soon as actual spend passes 1 cent
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 1, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 1, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  WebsiteUrl:
    Description: HTTPS address of the site (certificate is issued automatically on first visit; give it a minute)
    Value: !Sub
      - 'https://${Dashed}.sslip.io'
      - Dashed: !Join ['-', !Split ['.', !GetAtt AppInstance.PublicIp]]
  PlainHttpUrl:
    Description: Fallback address without HTTPS
    Value: !Sub 'http://${AppInstance.PublicIp}'
  InstanceId:
    Value: !Ref AppInstance
  ShellAccess:
    Description: Open a shell on the server without SSH keys
    Value: !Sub 'aws ssm start-session --target ${AppInstance} --region ${AWS::Region}'
